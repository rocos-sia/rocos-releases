name: Sync component releases
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [component-released]
permissions:
  contents: write
concurrency:
  group: release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Mirror releases and validate manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_releases.py
      - name: Commit changed channel manifests
        run: |
          git add channels/stable.json channels/internal.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: synchronize component releases'
            git push origin HEAD:main
          fi
